<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مترجم اليوتيوب - أيفون</title>
  <style>
    :root {
      /* متغيرات الافتراضية للتحكم */
      --highlight-color: #ffd60a;
      --de-font-size: 20px;
      --ar-font-size: 17px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    h3 { margin-top: 5px; font-size: 18px; color: #f5f5f7; }
    
    /* شريط إدخال الرابط */
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: #fff;
      font-size: 14px;
      -webkit-appearance: none;
    }
    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
    }

    /* شريط أدوات التحكم في الخط والألوان */
    .controls-bar {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid #2c2c2e;
      font-size: 13px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group label { color: #8e8e93; }
    .control-group input[type="color"] {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }
    .control-group input[type="range"] {
      width: 80px;
    }
    
    /* مشغل الفيديو */
    #player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      margin-bottom: 15px;
    }
    #player-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* كارت الترجمة */
    .subtitles-card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 15px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid #2c2c2e;
    }
    .de-text {
      font-size: var(--de-font-size);
      color: #e5e5ea;
      direction: ltr;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .ar-text {
      font-size: var(--ar-font-size);
      color: #30d158;
      font-weight: 500;
    }

    /* التمييز الحي للكلمة المنطوقة باستخدام المتغيرات */
    .word {
      display: inline-block;
      padding: 0 3px;
      transition: all 0.1s ease;
    }
    .word.active {
      color: var(--highlight-color);
      font-weight: bold;
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      text-shadow: 0 0 5px var(--highlight-color);
    }
  </style>
</head>
<body>

  <h3>مترجم اليوتيوب التفاعلي</h3>

  <!-- شريط إدخال الرابط -->
  <div class="input-box">
    <input type="text" id="ytUrl" placeholder="ضع رابط اليوتيوب هنا...">
    <button onclick="startApp()">تشغيل</button>
  </div>

  <!-- شريط الخيارات والتحكم -->
  <div class="controls-bar">
    <div class="control-group">
      <label>لون التظليل:</label>
      <input type="color" id="colorPicker" value="#ffd60a" oninput="updateSettings()">
    </div>
    
    <div class="control-group">
      <label>حجم الخط الألماني:</label>
      <input type="range" id="deSize" min="16" max="32" value="20" oninput="updateSettings()">
    </div>

    <div class="control-group">
      <label>حجم الخط العربي:</label>
      <input type="range" id="arSize" min="14" max="28" value="17" oninput="updateSettings()">
    </div>
  </div>

  <!-- مشغل الفيديو -->
  <div id="player-container">
    <div id="player"></div>
  </div>

  <!-- عرض الترجمة -->
  <div class="subtitles-card">
    <div id="deText" class="de-text">السطر الألماني يظهر هنا...</div>
    <div id="arText" class="ar-text">الترجمة العربية...</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let timer;

    const sampleSubtitles = [
      {
        ar: "مرحباً بكم في هذا الفيديو التعليمي.",
        words: [
          { word: "Willkommen", start: 0.5, end: 1.2 },
          { word: "zu", start: 1.3, end: 1.5 },
          { word: "diesem", start: 1.6, end: 2.0 },
          { word: "Video.", start: 2.1, end: 2.8 }
        ]
      }
    ];

    // دالة تحديث الإعدادات في الوقت الفعلي
    function updateSettings() {
      const color = document.getElementById('colorPicker').value;
      const deSize = document.getElementById('deSize').value + 'px';
      const arSize = document.getElementById('arSize').value + 'px';

      document.documentElement.style.setProperty('--highlight-color', color);
      document.documentElement.style.setProperty('--de-font-size', deSize);
      document.documentElement.style.setProperty('--ar-font-size', arSize);
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function startApp() {
      const url = document.getElementById('ytUrl').value;
      if(!url) return;
      const videoId = extractVideoId(url);

      if (player) {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        timer = setInterval(syncSubtitles, 100);
      } else {
        clearInterval(timer);
      }
    }

    function syncSubtitles() {
      if (!player || !player.getCurrentTime) return;
      const time = player.getCurrentTime();

      const current = sampleSubtitles.find(s => 
        time >= s.words[0].start && time <= s.words[s.words.length - 1].end
      );

      if (current) {
        document.getElementById('arText').innerText = current.ar;
        document.getElementById('deText').innerHTML = current.words.map(w => {
          const active = time >= w.start && time <= w.end;
          return `<span class="word ${active ? 'active' : ''}">${w.word}</span>`;
        }).join(' ');
      }
    }
  </script>
</body>
</html>
