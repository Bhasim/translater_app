<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مترجم اليوتيوب التفاعلي</title>
  <style>
    :root {
      --highlight-color: #ffd60a;
      --de-font-size: 20px;
      --ar-font-size: 17px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    h3 { margin-top: 5px; font-size: 18px; color: #f5f5f7; }
    
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: #fff;
      font-size: 14px;
      -webkit-appearance: none;
    }
    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .controls-bar {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid #2c2c2e;
      font-size: 13px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group label { color: #8e8e93; }
    .control-group input[type="color"] {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }
    .control-group input[type="range"] {
      width: 80px;
    }
    
    #player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      margin-bottom: 15px;
    }
    #player-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .subtitles-card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 15px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid #2c2c2e;
    }
    .de-text {
      font-size: var(--de-font-size);
      color: #e5e5ea;
      direction: ltr;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .ar-text {
      font-size: var(--ar-font-size);
      color: #30d158;
      font-weight: 500;
    }

    .status-msg {
      font-size: 13px;
      color: #ff9f0a;
      margin-bottom: 8px;
      font-weight: 500;
      line-height: 1.4;
    }

    .word {
      display: inline-block;
      padding: 0 3px;
      transition: all 0.1s ease;
    }
    .word.active {
      color: var(--highlight-color);
      font-weight: bold;
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      text-shadow: 0 0 5px var(--highlight-color);
    }
  </style>
</head>
<body>

  <h3>مترجم اليوتيوب التفاعلي</h3>

  <div class="input-box">
    <input type="text" id="ytUrl" placeholder="ضع رابط الفيديو هنا...">
    <button onclick="startApp()">بدء المعالجة</button>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <label>لون التظليل:</label>
      <input type="color" id="colorPicker" value="#ffd60a" oninput="updateSettings()">
    </div>
    
    <div class="control-group">
      <label>خط ألماني:</label>
      <input type="range" id="deSize" min="16" max="32" value="20" oninput="updateSettings()">
    </div>

    <div class="control-group">
      <label>خط عربي:</label>
      <input type="range" id="arSize" min="14" max="28" value="17" oninput="updateSettings()">
    </div>
  </div>

  <div id="statusMsg" class="status-msg">أدخل الرابط واضغط بدء المعالجة</div>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <div class="subtitles-card">
    <div id="deText" class="de-text">السطر الألماني يظهر هنا...</div>
    <div id="arText" class="ar-text">الترجمة العربية...</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let timer;
    let subtitlesData = [];

    function updateSettings() {
      const color = document.getElementById('colorPicker').value;
      const deSize = document.getElementById('deSize').value + 'px';
      const arSize = document.getElementById('arSize').value + 'px';

      document.documentElement.style.setProperty('--highlight-color', color);
      document.documentElement.style.setProperty('--de-font-size', deSize);
      document.documentElement.style.setProperty('--ar-font-size', arSize);
    }

    // استخراج ID الفيديو بدقة مع تنظيف أي رموز مشاركة إضافية
    function extractVideoId(url) {
      if (!url) return '';
      let cleanUrl = url.trim();
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = cleanUrl.match(regExp);
      return (match && match[1]) ? match[1] : cleanUrl;
    }

    async function fetchSubtitles(videoId) {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.innerText = "🔍 جاري الاتصال بخادم الاستخراج لتجهيز السكريبت...";
      subtitlesData = [];

      // استخدام خادم AllOrigins الآمن لتجاوز حظر CORS وجلب الترجمة
      const targetApi = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://youtube.com/watch?v=${videoId}`)}`;

      try {
        const response = await fetch(targetApi);
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        // البحث عن مسار ملف الترجمة المباشر داخل صفحة الفيديو
        const html = data.contents;
        const captionTracksRegex = /"captionTracks":\s*(\[.*?\])/;
        const match = html.match(captionTracksRegex);

        if (match && match[1]) {
          const captionTracks = JSON.parse(match[1]);
          // البحث عن المسار الألماني أولاً، وإن لم يوجد نأخذ أول مسار ترجمة متاح
          let track = captionTracks.find(t => t.languageCode === 'de') || captionTracks[0];

          if (track && track.baseUrl) {
            statusDiv.innerText = "✅ تم العثور على السكريبت! جاري الترجمة والتوقيت...";
            await fetchXmlSubtitles(track.baseUrl);
            return;
          }
        }
      } catch (e) {
        console.log("محاولة عبر الخادم الاحتياطي...");
      }

      // محاولة احتياطية ثانية في حال فشل الأولى
      try {
        const resFallback = await fetch(`https://yt-subtitles-api.vercel.app/api/subtitles?videoId=${videoId}&lang=de`);
        if (resFallback.ok) {
          const dataFallback = await resFallback.json();
          if (dataFallback && dataFallback.length > 0) {
            statusDiv.innerText = "✅ تم جلب السكريبت بنجاح!";
            await processRawSubtitles(dataFallback);
            return;
          }
        }
      } catch(err) {}

      statusDiv.innerHTML = "⚠️ يتعذر جلب سكريبت هذا الفيديو برمجياً.<br>تأكد من تفعيل زر الترجمة (CC) من داخل مشغل يوتيوب المدمج بالأعلى.";
    }

    async function fetchXmlSubtitles(baseUrl) {
      const statusDiv = document.getElementById('statusMsg');
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl + '&fmt=json3')}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        const json3 = JSON.parse(data.contents);

        subtitlesData = [];
        if (json3 && json3.events) {
          for (let event of json3.events) {
            if (!event.segs) continue;
            
            const start = event.tStartMs / 1000;
            const duration = (event.dDurationMs || 2000) / 1000;
            const fullText = event.segs.map(s => s.utf8).join('').replace(/\n/g, ' ').trim();
            
            if (!fullText) continue;

            const wordsList = fullText.split(' ').filter(w => w.length > 0);
            const wordDuration = duration / Math.max(wordsList.length, 1);
            
            let currentWordStart = start;
            const timedWords = wordsList.map(w => {
              const wObj = {
                word: w,
                start: currentWordStart,
                end: currentWordStart + wordDuration
              };
              currentWordStart += wordDuration;
              return wObj;
            });

            const arTranslation = await translateToArabic(fullText);

            subtitlesData.push({
              start: start,
              end: start + duration,
              text: fullText,
              arText: arTranslation,
              words: timedWords
            });
          }
          statusDiv.innerText = "✨ اكتمل جلب السكريبت والترجمة بنجاح!";
        }
      } catch (e) {
        statusDiv.innerText = "⚠️ فشل تحليل نص السكريبت.";
      }
    }

    async function processRawSubtitles(data) {
      subtitlesData = [];
      for (let item of data) {
        const start = item.start;
        const duration = item.dur || 2;
        const fullText = item.text.replace(/&quot;/g, '"').replace(/&#39;/g, "'");
        
        const wordsList = fullText.split(' ').filter(w => w.length > 0);
        const wordDuration = duration / Math.max(wordsList.length, 1);
        
        let currentWordStart = start;
        const timedWords = wordsList.map(w => {
          const wObj = {
            word: w,
            start: currentWordStart,
            end: currentWordStart + wordDuration
          };
          currentWordStart += wordDuration;
          return wObj;
        });

        const arTranslation = await translateToArabic(fullText);

        subtitlesData.push({
          start: start,
          end: start + duration,
          text: fullText,
          arText: arTranslation,
          words: timedWords
        });
      }
    }

    async function translateToArabic(text) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=ar&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
      } catch (e) {
        return text;
      }
    }

    async function startApp() {
      const urlInput = document.getElementById('ytUrl').value;
      if (!urlInput) return;
      
      const videoId = extractVideoId(urlInput);

      await fetchSubtitles(videoId);

      if (player) {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: {
            'cc_load_policy': 1,
            'cc_lang_pref': 'de'
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        timer = setInterval(syncSubtitles, 100);
      } else {
        clearInterval(timer);
      }
    }

    function syncSubtitles() {
      if (!player || !player.getCurrentTime || subtitlesData.length === 0) return;
      
      const time = player.getCurrentTime();
      const current = subtitlesData.find(s => time >= s.start && time <= s.end);

      const deDiv = document.getElementById('deText');
      const arDiv = document.getElementById('arText');

      if (current) {
        arDiv.innerText = current.arText || 'جاري الترجمة...';
        deDiv.innerHTML = current.words.map(w => {
          const active = time >= w.start && time <= w.end;
          return `<span class="word ${active ? 'active' : ''}">${w.word}</span>`;
        }).join(' ');
      }
    }
  </script>
</body>
</html>
