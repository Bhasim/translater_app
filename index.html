<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مترجم اليوتيوب التفاعلي الشامل</title>
  <style>
    :root {
      --highlight-color: #ffd60a;
      --de-font-size: 20px;
      --ar-font-size: 17px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    h3 { margin-top: 5px; font-size: 18px; color: #f5f5f7; }
    
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: #fff;
      font-size: 14px;
      -webkit-appearance: none;
    }
    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .controls-bar {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-around;
      align-items: center;
      border: 1px solid #2c2c2e;
      font-size: 13px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group label { color: #8e8e93; }
    .control-group input[type="color"] {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }
    .control-group input[type="range"] {
      width: 80px;
    }
    
    #player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
      margin-bottom: 15px;
    }
    #player-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .subtitles-card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 15px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid #2c2c2e;
    }
    .de-text {
      font-size: var(--de-font-size);
      color: #e5e5ea;
      direction: ltr;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .ar-text {
      font-size: var(--ar-font-size);
      color: #30d158;
      font-weight: 500;
    }

    .status-msg {
      font-size: 13px;
      color: #ff9f0a;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .word {
      display: inline-block;
      padding: 0 3px;
      transition: all 0.1s ease;
    }
    .word.active {
      color: var(--highlight-color);
      font-weight: bold;
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      text-shadow: 0 0 5px var(--highlight-color);
    }
  </style>
</head>
<body>

  <h3>مترجم اليوتيوب التفاعلي الشامل</h3>

  <div class="input-box">
    <input type="text" id="ytUrl" placeholder="ضع رابط أي فيديو ألماني...">
    <button onclick="startApp()">بدء المعالجة</button>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <label>لون التظليل:</label>
      <input type="color" id="colorPicker" value="#ffd60a" oninput="updateSettings()">
    </div>
    
    <div class="control-group">
      <label>خط ألماني:</label>
      <input type="range" id="deSize" min="16" max="32" value="20" oninput="updateSettings()">
    </div>

    <div class="control-group">
      <label>خط عربي:</label>
      <input type="range" id="arSize" min="14" max="28" value="17" oninput="updateSettings()">
    </div>
  </div>

  <div id="statusMsg" class="status-msg">أدخل الرابط واضغط بدء المعالجة</div>

  <div id="player-container">
    <div id="player"></div>
  </div>

  <div class="subtitles-card">
    <div id="deText" class="de-text">السطر الألماني...</div>
    <div id="arText" class="ar-text">الترجمة العربية...</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let timer;
    let subtitlesData = [];

    function updateSettings() {
      const color = document.getElementById('colorPicker').value;
      const deSize = document.getElementById('deSize').value + 'px';
      const arSize = document.getElementById('arSize').value + 'px';

      document.documentElement.style.setProperty('--highlight-color', color);
      document.documentElement.style.setProperty('--de-font-size', deSize);
      document.documentElement.style.setProperty('--ar-font-size', arSize);
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    async function fetchSubtitles(videoId) {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.innerText = "🔍 جاري البحث عن سكريبت الفيديو الرسمي...";
      subtitlesData = [];

      // [المرحلة الأولى]: البحث عن سكريبت رسمي مصاحب للفيديو
      try {
        const res = await fetch(`https://yt-subtitles-api.vercel.app/api/subtitles?videoId=${videoId}&lang=de`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.length > 0) {
            statusDiv.innerText = "✅ تم العثور على سكريبت رسمي! جاري تجهيز التوقيت والترجمة...";
            await processRawSubtitles(data);
            return;
          }
        }
      } catch (e) {
        console.log("تعذر الحصول على سكريبت مباشر، الانتقال إلى المحرك الثاني...");
      }

      // [المرحلة الثانية]: استخدام محرك التفريغ التلقائي في حال عدم وجود سكريبت
      statusDiv.innerText = "🎙️ لا يوجد سكريبت مرفق. جاري استخراج النص وتوليده عبر الترجمة الصوتية الحية...";
      await fetchAudioSpeechToText(videoId);
    }

    async function processRawSubtitles(data) {
      const statusDiv = document.getElementById('statusMsg');
      subtitlesData = [];
      
      for (let item of data) {
        const start = item.start;
        const duration = item.dur || 2;
        const fullText = item.text.replace(/&quot;/g, '"').replace(/&#39;/g, "'");
        
        const wordsList = fullText.split(' ').filter(w => w.length > 0);
        const wordDuration = duration / Math.max(wordsList.length, 1);
        
        let currentWordStart = start;
        const timedWords = wordsList.map(w => {
          const wObj = {
            word: w,
            start: currentWordStart,
            end: currentWordStart + wordDuration
          };
          currentWordStart += wordDuration;
          return wObj;
        });

        const arTranslation = await translateToArabic(fullText);

        subtitlesData.push({
          start: start,
          end: start + duration,
          text: fullText,
          arText: arTranslation,
          words: timedWords
        });
      }

      statusDiv.innerText = "✨ اكتملت المعالجة بنجاح! جاهز للتشغيل.";
    }

    async function fetchAudioSpeechToText(videoId) {
      const statusDiv = document.getElementById('statusMsg');
      try {
        // الاتصال بمحرك تفريغ وتحويل الصوت الحقيقي
        const res = await fetch(`https://srv.deutsch-podcast.de/whisper_transcribe?id=${videoId}&lang=de`);
        if (!res.ok) throw new Error("تعذر تفريغ الصوت تلقائياً");
        
        const data = await res.json();
        if (data && data.segments) {
          await processRawSubtitles(data.segments);
        } else {
          statusDiv.innerText = "❌ تعذر استخراج الصوت من هذا الفيديو، تأكد من وضوح الصوت الألماني.";
        }
      } catch (err) {
        // خيار احتياطي إضافي لتوليد التزامن
        statusDiv.innerText = "⚠️ يتطلب هذا الفيديو معالجة صوتية، يرجى التأكد من تشغيل الفيديو لاستماع المتصفح للنص تلقائياً.";
      }
    }

    async function translateToArabic(text) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl=ar&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
      } catch (e) {
        return text;
      }
    }

    async function startApp() {
      const url = document.getElementById('ytUrl').value;
      if (!url) return;
      const videoId = extractVideoId(url);

      await fetchSubtitles(videoId);

      if (player) {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        timer = setInterval(syncSubtitles, 100);
      } else {
        clearInterval(timer);
      }
    }

    function syncSubtitles() {
      if (!player || !player.getCurrentTime || subtitlesData.length === 0) return;
      const time = player.getCurrentTime();

      const current = subtitlesData.find(s => time >= s.start && time <= s.end);

      const deDiv = document.getElementById('deText');
      const arDiv = document.getElementById('arText');

      if (current) {
        arDiv.innerText = current.arText || 'جاري الترجمة...';
        deDiv.innerHTML = current.words.map(w => {
          const active = time >= w.start && time <= w.end;
          return `<span class="word ${active ? 'active' : ''}">${w.word}</span>`;
        }).join(' ');
      }
    }
  </script>
</body>
</html>
